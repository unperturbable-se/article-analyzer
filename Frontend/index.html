<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Corpus — analyze passage topics & similarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="page">
  <header class="intro">
    <h1>Gather your passages.</h1>
    <p>Add every article or passage you want examined. Each one becomes a separate entry below — add as many as you need.</p>
    <p class="fine">Passages are analyzed for shared themes, individual document topics, cluster root subjects, and pairwise cosine similarity.</p>
  </header>

  <main>
    <div id="entries"></div>
    <button id="addBtn" class="add-btn" type="button">+ Add another passage</button>
  </main>

  <div id="results" class="results" hidden></div>
</div>

<div class="toolbar">
  <div class="toolbar-inner">
    <span id="count" class="count">1 passage ready</span>
    <button id="submitBtn" class="submit-btn" type="button">Analyze passages</button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</div>

<script src="script.js"></script>
</body>
</html>
